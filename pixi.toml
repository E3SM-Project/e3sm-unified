[workspace]
name = "e3sm-unified-ci"
channels = ["conda-forge"]
platforms = ["linux-64"]
channel-priority = "strict"

[dependencies]
python = ">=3.12,<3.15"
mache = "==5.5.2"
pytest = "*"
pyyaml = "*"
rattler-build = "*"
sphinx = ">=7.0.0"
sphinx_rtd_theme = "*"
"myst-parser" = "*"

[feature.py312.dependencies]
python = "3.12.*"

[feature.py313.dependencies]
python = "3.13.*"

[feature.py314.dependencies]
python = "3.14.*"

[environments]
py312 = ["py312"]
py313 = ["py313"]
py314 = ["py314"]
